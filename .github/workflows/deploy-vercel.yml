name: Deploy KMP Web to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KMP WebAssembly Distribution
        run: |
          chmod +x ./gradlew
          ./gradlew :app:webApp:wasmJsBrowserDistribution --no-daemon

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_qll3zocF7FEg6DBemdOqqIui
          vercel-project-id: prj_kXYhGJfS6queVKAjIuNaJ9kqkupT
          vercel-args: '--prod'
          working-directory: ./app/webApp/build/dist/wasmJs/productionExecutable
