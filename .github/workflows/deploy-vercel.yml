name: Deploy KMP Web to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KMP WebAssembly Distribution
        run: |
          chmod +x ./gradlew
          ./gradlew :app:webApp:wasmJsBrowserDistribution --no-daemon

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_qll3zocF7FEg6DBemdOqqIui
          VERCEL_PROJECT_ID: prj_kXYhGJfS6queVKAjIuNaJ9kqkupT
        run: |
          cp vercel.json ./app/webApp/build/dist/wasmJs/productionExecutable/
          npx vercel@latest deploy ./app/webApp/build/dist/wasmJs/productionExecutable --prod --token="$VERCEL_TOKEN" --yes
