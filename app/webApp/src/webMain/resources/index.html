    <!-- Polyfill WebGL renderer info for Safari / WebKit to prevent Skiko context creation nullptr failure -->
    <script>
        (function () {
            var UNMASKED_VENDOR_WEBGL = 0x9245;
            var UNMASKED_RENDERER_WEBGL = 0x9246;

            function patchContext(proto) {
                if (!proto || proto._skiko_patched) return;
                proto._skiko_patched = true;

                var origGetParameter = proto.getParameter;
                var origGetExtension = proto.getExtension;
                var origGetSupportedExtensions = proto.getSupportedExtensions;

                if (origGetExtension) {
                    proto.getExtension = function (name) {
                        if (name === 'WEBGL_debug_renderer_info') {
                            return {
                                UNMASKED_VENDOR_WEBGL: UNMASKED_VENDOR_WEBGL,
                                UNMASKED_RENDERER_WEBGL: UNMASKED_RENDERER_WEBGL
                            };
                        }
                        try {
                            return origGetExtension.apply(this, arguments);
                        } catch (e) {
                            return null;
                        }
                    };
                }

                if (origGetSupportedExtensions) {
                    proto.getSupportedExtensions = function () {
                        try {
                            var exts = origGetSupportedExtensions.apply(this, arguments) || [];
                            if (exts.indexOf('WEBGL_debug_renderer_info') === -1) {
                                exts = Array.from(exts);
                                exts.push('WEBGL_debug_renderer_info');
                            }
                            return exts;
                        } catch (e) {
                            return ['WEBGL_debug_renderer_info'];
                        }
                    };
                }

                if (origGetParameter) {
                    proto.getParameter = function (pname) {
                        if (pname === UNMASKED_VENDOR_WEBGL || pname === 37445) {
                            return 'Apple Inc.';
                        }
                        if (pname === UNMASKED_RENDERER_WEBGL || pname === 37446) {
                            return 'Apple GPU';
                        }
                        if (pname === 0x0D57 || pname === 3415) { // STENCIL_BITS
                            return 8;
                        }
                        if (pname === 0x0D56 || pname === 3414) { // DEPTH_BITS
                            return 24;
                        }
                        try {
                            var res = origGetParameter.apply(this, arguments);
                            if (res === null || res === undefined) {
                                if (pname === 0x1F00 || pname === 7936) return 'WebKit';
                                if (pname === 0x1F01 || pname === 7937) return 'WebKit WebGL';
                                if (pname === 0x1F02 || pname === 7938) return 'WebGL 2.0';
                                if (pname === 0x8B8C || pname === 35724) return 'WebGL GLSL ES 3.00';
                            }
                            return res;
                        } catch (e) {
                            if (pname === 0x1F00 || pname === 7936) return 'WebKit';
                            if (pname === 0x1F01 || pname === 7937) return 'WebKit WebGL';
                            if (pname === 0x1F02 || pname === 7938) return 'WebGL 2.0';
                            if (pname === 0x8B8C || pname === 35724) return 'WebGL GLSL ES 3.00';
                            return null;
                        }
                    };
                }

                if (proto.getError) {
                    var origGetError = proto.getError;
                    proto.getError = function () {
                        try {
                            var err = origGetError.apply(this, arguments);
                            if (err === 1280 || err === 1282) {
                                return 0;
                            }
                            return err;
                        } catch (e) {
                            return 0;
                        }
                    };
                }
            }

            if (typeof WebGLRenderingContext !== 'undefined') {
                patchContext(WebGLRenderingContext.prototype);
            }
            if (typeof WebGL2RenderingContext !== 'undefined') {
                patchContext(WebGL2RenderingContext.prototype);
            }

            if (typeof HTMLCanvasElement !== 'undefined') {
                var origGetContext = HTMLCanvasElement.prototype.getContext;
                HTMLCanvasElement.prototype.getContext = function () {
                    if (!this.width || this.width <= 0) {
                        this.width = window.innerWidth || 1024;
                    }
                    if (!this.height || this.height <= 0) {
                        this.height = window.innerHeight || 768;
                    }
                    if (arguments.length > 1 && typeof arguments[1] === 'object' && arguments[1] !== null) {
                        var attrs = arguments[1];
                        if (typeof attrs.stencil === 'number') attrs.stencil = true;
                        if (typeof attrs.depth === 'number') attrs.depth = true;
                        if (typeof attrs.alpha === 'number') attrs.alpha = true;
                        if (typeof attrs.antialias === 'number') attrs.antialias = false;
                    }
                    var ctx = origGetContext.apply(this, arguments);
                    if (ctx && (arguments[0] === 'webgl' || arguments[0] === 'webgl2' || arguments[0] === 'experimental-webgl')) {
                        patchContext(Object.getPrototypeOf(ctx));
                        patchContext(ctx);
                    }
                    return ctx;
                };
            }
        })();
    </script>
</head>

<body>
    <div id="root">
        <div id="loading" class="loading-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 50 50" role="presentation">
                <circle cx="25" cy="25" r="20" stroke="#21262d" stroke-width="4" fill="none" />
                <circle cx="25" cy="25" r="20" stroke="#3ddc84" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-dasharray="90 125">
                    <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                        repeatCount="indefinite" />
                </circle>
            </svg>
            <p class="loading-text">Loading Portfolio...</p>
        </div>
    </div>
    <script>
        // Ensure loading indicator is removed as soon as the Compose canvas appears
        var observer = new MutationObserver(function() {
            var canvas = document.querySelector('canvas');
            if (canvas) {
                var loading = document.getElementById('loading');
                if (loading) loading.remove();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>
    <script type="application/javascript" src="webApp.js?v=20261121_safari_fix2"></script>
