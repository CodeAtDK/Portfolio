<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dhruva Khatavkar | Portfolio</title>
    <link type="text/css" rel="stylesheet" href="styles.css?v=6">
</head>

<body>
    <div id="root">
        <div id="loading" class="loading-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 50 50" role="presentation">
                <circle cx="25" cy="25" r="20" stroke="#21262d" stroke-width="4" fill="none" />
                <circle cx="25" cy="25" r="20" stroke="#3ddc84" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-dasharray="90 125">
                    <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                        repeatCount="indefinite" />
                </circle>
            </svg>
            <p class="loading-text">Loading Portfolio...</p>
        </div>
    </div>
    <script>
        // Ensure loading indicator is removed as soon as the Compose canvas appears
        var observer = new MutationObserver(function() {
            var canvas = document.querySelector('canvas');
            if (canvas) {
                var loading = document.getElementById('loading');
                if (loading) loading.remove();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>
    <script>
        var errorCount = 0;
        window.addEventListener('error', function(e) {
            console.error('GLOBAL ERROR:', e.message, e.filename, e.lineno, e.error);
            if (errorCount++ < 10) {
                var stack = '';
                if (e.error) {
                    stack = e.error.stack || e.error.toString();
                }
                fetch('/log_error', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message: e.message || 'unknown error',
                        stack: stack,
                        filename: e.filename,
                        lineno: e.lineno
                    })
                }).catch(function(){});
            }
        });
        window.addEventListener('unhandledrejection', function(e) {
            console.error('UNHANDLED PROMISE REJECTION:', e.reason);
            if (errorCount++ < 10) {
                fetch('/log_error', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message: 'Unhandled Rejection: ' + (e.reason ? (e.reason.message || e.reason.toString()) : 'unknown'),
                        stack: e.reason ? (e.reason.stack || e.reason.toString()) : '',
                        filename: 'promise',
                        lineno: 0
                    })
                }).catch(function(){});
            }
        });
    </script>
    <script type="application/javascript" src="webApp.js?v=20261121_stable_v1"></script>
</body>

</html>
